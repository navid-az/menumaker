services:
  backend:
    build: ./backend
    env_file:
      - .env
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    volumes:
      - ./backend:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    ports:
      - "8000:8000"   # temporary — goes away once nginx is added
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* must be passed as build args — baked in at build time
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
        - NEXT_PUBLIC_MEDIA_URL=${NEXT_PUBLIC_MEDIA_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_DEMO_MODE_ENABLED=${NEXT_PUBLIC_DEMO_MODE_ENABLED}
    environment:
      # Server-side only vars — available at runtime, never sent to browser
      - API_URL=${API_URL}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped


  redis:
    image: redis:latest
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  media_data: